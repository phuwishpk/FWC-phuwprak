<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="profile-card">
        
        <div class="card-header">
            <h2>User Profile Card</h2>
        </div>

        <table class="invisible-table">
            
            <tr>
                <td>

                    <img src="https://images.unsplash.com/photo-1517849845537-4d257902454a?q=80&w=200&auto=format&fit=crop" alt="Profile Picture" class="profile-pic">
                </td>
            </tr>


            <tr>
                <td class="login-name">Phuwish</td>
            </tr>

            <tr>
                <td class="description">kmitl</td>
            </tr>

            <tr>
                <td class="social-icons">
                    <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub"></a>
                    <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Instagram"></a>
                    <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn"></a>
                </td>
            </tr>

            <tr>
                <td>
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>

        </table>
    </div>

</body>
</html>
