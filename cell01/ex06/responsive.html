<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Table</title>
</head>
<body style="margin: 0; padding: 0;">

    <table style="width: 100vw; height: 100vh; border-collapse: collapse; text-align: center;">
        <tr>
            
            <td style="background-color: lightblue; width: 50%;">
                <h2>First cell</h2>
                <p>Hello, this side is blue!</p>
            </td>
            
            <td style="background-color: lightgreen; width: 50%;">
                <h2>Second cell</h2>
                <p>And this side is green!</p>
            </td>

        </tr>
    </table>

</body>
</html>
